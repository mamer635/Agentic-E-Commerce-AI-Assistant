<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ShopAI</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           VARIABLES
        ===================================================== */

        :root {

            --bg: #070711;

            --sidebar: #0b0b16;

            --panel: #10101d;

            --panel-light: #151526;

            --border: rgba(255, 255, 255, 0.08);

            --border-hover: rgba(139, 92, 246, 0.35);

            --text: #f5f5ff;

            --muted: #85859a;

            --muted-light: #a5a5b8;

            --purple: #8b5cf6;

            --purple-dark: #7c3aed;

            --blue: #6366f1;

            --cyan: #22d3ee;

            --green: #34d399;

            --red: #fb7185;

        }


        /* =====================================================
           BODY
        ===================================================== */

        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

        }


        body {

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: var(--text);

            background:

                radial-gradient(
                    circle at 75% 0%,
                    rgba(139, 92, 246, 0.15),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 25% 100%,
                    rgba(99, 102, 241, 0.08),
                    transparent 30%
                ),

                var(--bg);

        }


        /* =====================================================
           APP
        ===================================================== */

        .app {

            width: 100%;
            height: 100vh;

            display: flex;

            position: relative;

            overflow: hidden;

        }


        /* =====================================================
           BACKGROUND EFFECT
        ===================================================== */

        .background-glow {

            position: fixed;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(139, 92, 246, 0.08),
                    transparent 70%
                );

            pointer-events: none;

            filter: blur(20px);

            animation: floatGlow 10s ease-in-out infinite;

        }


        .background-glow.one {

            top: -250px;
            right: 100px;

        }


        .background-glow.two {

            bottom: -300px;
            left: 300px;

            animation-delay: 4s;

        }


        @keyframes floatGlow {

            0%,
            100% {

                transform: translate(0, 0);

            }

            50% {

                transform: translate(30px, 20px);

            }

        }


        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {

            width: 275px;

            flex-shrink: 0;

            display: flex;

            flex-direction: column;

            padding: 20px 15px;

            background:
                linear-gradient(
                    180deg,
                    rgba(13, 13, 25, 0.97),
                    rgba(8, 8, 16, 0.97)
                );

            border-right: 1px solid var(--border);

            backdrop-filter: blur(25px);

            position: relative;

            z-index: 10;

        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo {

            display: flex;

            align-items: center;

            gap: 11px;

            padding: 2px 8px 25px;

            font-size: 21px;

            font-weight: 750;

            letter-spacing: -0.5px;

        }


        .logo-icon {

            width: 39px;
            height: 39px;

            display: grid;

            place-items: center;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--blue)
                );

            color: white;

            font-size: 18px;

            box-shadow:
                0 0 20px rgba(139, 92, 246, 0.25);

            animation: logoPulse 3s ease-in-out infinite;

        }


        @keyframes logoPulse {

            0%,
            100% {

                box-shadow:
                    0 0 18px rgba(139, 92, 246, 0.25);

            }

            50% {

                box-shadow:
                    0 0 32px rgba(139, 92, 246, 0.5);

            }

        }


        /* =====================================================
           NEW CHAT BUTTON
        ===================================================== */

        .new-chat {

            width: 100%;

            border: 1px solid
                rgba(255, 255, 255, 0.1);

            border-radius: 12px;

            padding: 12px;

            color: white;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--blue)
                );

            box-shadow:
                0 10px 30px
                rgba(99, 102, 241, 0.18);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;

            margin-bottom: 27px;

        }


        .new-chat:hover {

            transform: translateY(-2px);

            filter: brightness(1.08);

            box-shadow:
                0 15px 35px
                rgba(99, 102, 241, 0.32);

        }


        .new-chat:active {

            transform: scale(0.98);

        }


        /* =====================================================
           SECTION TITLE
        ===================================================== */

        .section-title {

            padding: 0 8px 10px;

            color: #5e6173;

            font-size: 10px;

            font-weight: 750;

            letter-spacing: 1.2px;

            text-transform: uppercase;

        }


        /* =====================================================
           CONVERSATIONS
        ===================================================== */

        .conversations {

            flex: 1;

            overflow-y: auto;

            padding-right: 3px;

        }


        .conversation {

            display: flex;

            align-items: center;

            gap: 8px;

            width: 100%;

            padding: 11px 12px;

            margin-bottom: 4px;

            border: 1px solid transparent;

            border-radius: 11px;

            color: #a7a8ba;

            cursor: pointer;

            font-size: 13px;

            transition:
                background 0.2s ease,
                border 0.2s ease,
                transform 0.2s ease,
                color 0.2s ease;

        }


        .conversation:hover {

            color: white;

            background:
                rgba(255, 255, 255, 0.045);

            border-color: var(--border);

            transform: translateX(3px);

        }


        .conversation.active {

            color: #ddd6fe;

            background:
                linear-gradient(
                    90deg,
                    rgba(139, 92, 246, 0.18),
                    rgba(99, 102, 241, 0.04)
                );

            border-color:
                rgba(139, 92, 246, 0.25);

            box-shadow:
                inset 3px 0 var(--purple),
                0 5px 20px
                rgba(139, 92, 246, 0.05);

        }


        .conversation-title {

            flex: 1;

            min-width: 0;

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;

        }


        /* =====================================================
           DELETE
        ===================================================== */

        .delete-conversation {

            border: none;

            background: transparent;

            color: #5e6174;

            font-size: 17px;

            cursor: pointer;

            opacity: 0;

            transition:
                color 0.2s ease,
                opacity 0.2s ease;

        }


        .conversation:hover
        .delete-conversation {

            opacity: 1;

        }


        .delete-conversation:hover {

            color: var(--red);

        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main {

            flex: 1;

            min-width: 0;

            height: 100vh;

            display: flex;

            flex-direction: column;

            position: relative;

        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {

            height: 68px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            padding: 0 28px;

            background:
                rgba(8, 8, 17, 0.72);

            border-bottom:
                1px solid var(--border);

            backdrop-filter: blur(20px);

            z-index: 5;

        }


        .header-content {

            display: flex;

            align-items: center;

            gap: 11px;

        }


        .header-title {

            font-size: 14px;

            font-weight: 650;

            color: #e9e9f2;

        }


        .online {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: var(--green);

            box-shadow:
                0 0 10px
                rgba(52, 211, 153, 0.8);

            animation: onlinePulse 2s infinite;

        }


        @keyframes onlinePulse {

            0%,
            100% {

                opacity: 1;

            }

            50% {

                opacity: 0.45;

            }

        }


        /* =====================================================
           CHAT
        ===================================================== */

        .chat {

            flex: 1;

            overflow-y: auto;

            padding: 35px 25px 145px;

            scroll-behavior: smooth;

        }


        /* =====================================================
           EMPTY STATE
        ===================================================== */

        .empty {

            min-height: 65%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            animation: emptyAppear 0.7s ease;

        }


        @keyframes emptyAppear {

            from {

                opacity: 0;

                transform: translateY(15px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }


        .empty-icon {

            width: 68px;
            height: 68px;

            display: grid;

            place-items: center;

            margin-bottom: 20px;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--blue)
                );

            font-size: 26px;

            box-shadow:
                0 0 45px
                rgba(139, 92, 246, 0.3);

            animation:
                emptyFloat 4s ease-in-out infinite;

        }


        @keyframes emptyFloat {

            0%,
            100% {

                transform: translateY(0);

            }

            50% {

                transform: translateY(-7px);

            }

        }


        .empty h2 {

            font-size: 25px;

            margin-bottom: 8px;

            letter-spacing: -0.6px;

        }


        .empty p {

            color: var(--muted);

            font-size: 13px;

        }


        /* =====================================================
           MESSAGE ROW
        ===================================================== */

        .message-row {

            width: min(920px, 100%);

            margin: 0 auto 20px;

            display: flex;

            align-items: flex-start;

            gap: 10px;

            animation:
                messageAppear 0.35s ease;

        }


        @keyframes messageAppear {

            from {

                opacity: 0;

                transform: translateY(10px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }


        .message-row.user {

            justify-content: flex-end;

        }


        /* =====================================================
           AVATAR
        ===================================================== */

        .avatar {

            width: 35px;
            height: 35px;

            flex-shrink: 0;

            display: grid;

            place-items: center;

            border-radius: 11px;

            font-size: 12px;

            font-weight: 750;

        }


        .avatar.ai {

            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--blue)
                );

            box-shadow:
                0 0 20px
                rgba(139, 92, 246, 0.2);

        }


        .avatar.user {

            order: 2;

            color: #c4b5fd;

            background: #171827;

            border:
                1px solid var(--border);

        }


        /* =====================================================
           BUBBLE
        ===================================================== */

        .bubble {

            max-width: 75%;

            padding: 14px 17px;

            border-radius: 16px;

            font-size: 13.5px;

            line-height: 1.7;

            white-space: pre-wrap;

            overflow-wrap: anywhere;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

        }


        .bubble:hover {

            transform: translateY(-1px);

        }


        /* =====================================================
           AI BUBBLE
        ===================================================== */

        .assistant .bubble {

            color: #e7e7f0;

            background:
                linear-gradient(
                    145deg,
                    rgba(21, 22, 38, 0.97),
                    rgba(13, 13, 24, 0.97)
                );

            border:
                1px solid var(--border);

            border-top-left-radius: 5px;

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.2),

                inset 0 1px
                rgba(255, 255, 255, 0.025);

        }


        /* =====================================================
           USER BUBBLE
        ===================================================== */

        .user .bubble {

            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--purple-dark),
                    var(--blue)
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            border-top-right-radius: 5px;

            box-shadow:
                0 10px 30px
                rgba(99, 102, 241, 0.2);

        }


        /* =====================================================
           TYPING
        ===================================================== */

        .typing {

            display: none;

            width: min(920px, calc(100% - 50px));

            margin: 0 auto;

            position: absolute;

            bottom: 94px;

            left: 0;
            right: 0;

            z-index: 3;

        }


        .typing-bubble {

            display: inline-flex;

            align-items: center;

            gap: 5px;

            padding: 13px 15px;

            border-radius: 14px;

            background:
                rgba(18, 18, 31, 0.95);

            border:
                1px solid var(--border);

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.2);

        }


        .dot {

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #a78bfa;

            animation:
                typingAnimation 1.2s infinite;

        }


        .dot:nth-child(2) {

            animation-delay: 0.15s;

        }


        .dot:nth-child(3) {

            animation-delay: 0.3s;

        }


        @keyframes typingAnimation {

            0%,
            60%,
            100% {

                opacity: 0.3;

                transform: translateY(0);

            }

            30% {

                opacity: 1;

                transform: translateY(-5px);

            }

        }


        /* =====================================================
           INPUT AREA
        ===================================================== */

        .input-area {

            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            padding: 15px 25px 23px;

            background:
                linear-gradient(
                    180deg,
                    transparent,
                    rgba(7, 7, 17, 0.88) 35%,
                    rgba(7, 7, 17, 1)
                );

            z-index: 5;

        }


        .input-container {

            width: min(920px, 100%);

            margin: auto;

            display: flex;

            align-items: center;

            padding: 6px 7px 6px 16px;

            border-radius: 17px;

            background:
                rgba(16, 16, 29, 0.93);

            border:
                1px solid
                rgba(255, 255, 255, 0.1);

            box-shadow:
                0 15px 50px
                rgba(0, 0, 0, 0.4);

            backdrop-filter: blur(20px);

            transition:
                border 0.25s ease,
                box-shadow 0.25s ease,
                transform 0.25s ease;

        }


        .input-container:focus-within {

            border-color:
                rgba(139, 92, 246, 0.55);

            box-shadow:

                0 0 0 3px
                rgba(139, 92, 246, 0.08),

                0 15px 50px
                rgba(0, 0, 0, 0.45),

                0 0 35px
                rgba(139, 92, 246, 0.08);

            transform: translateY(-1px);

        }


        #messageInput {

            flex: 1;

            min-width: 0;

            border: none;

            outline: none;

            background: transparent;

            color: white;

            padding: 11px 8px;

            font-size: 14px;

        }


        #messageInput::placeholder {

            color: #606175;

        }


        /* =====================================================
           SEND BUTTON
        ===================================================== */

        #sendButton {

            width: 42px;
            height: 42px;

            flex-shrink: 0;

            border: none;

            border-radius: 12px;

            display: grid;

            place-items: center;

            color: white;

            font-size: 16px;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    var(--purple),
                    var(--blue)
                );

            box-shadow:
                0 8px 22px
                rgba(99, 102, 241, 0.25);

            transition:
                transform 0.2s ease,
                filter 0.2s ease,
                box-shadow 0.2s ease;

        }


        #sendButton:hover {

            transform:
                translateY(-2px)
                scale(1.03);

            filter: brightness(1.08);

            box-shadow:
                0 12px 28px
                rgba(99, 102, 241, 0.4);

        }


        #sendButton:active {

            transform: scale(0.95);

        }


        #sendButton:disabled {

            opacity: 0.4;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;

        }


        /* =====================================================
           SCROLLBAR
        ===================================================== */

        * {

            scrollbar-width: thin;

            scrollbar-color:
                #303047
                transparent;

        }


        *::-webkit-scrollbar {

            width: 7px;
            height: 7px;

        }


        *::-webkit-scrollbar-track {

            background: transparent;

        }


        *::-webkit-scrollbar-thumb {

            background: #303047;

            border-radius: 10px;

        }


        *::-webkit-scrollbar-thumb:hover {

            background: #464662;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 750px) {

            .sidebar {

                width: 220px;

            }

            .chat {

                padding-left: 15px;

                padding-right: 15px;

            }

            .bubble {

                max-width: 84%;

            }

            .header {

                padding-left: 18px;

                padding-right: 18px;

            }

            .input-area {

                padding-left: 12px;

                padding-right: 12px;

            }

        }


        @media (max-width: 550px) {

            .sidebar {

                width: 185px;

            }

            .logo {

                font-size: 18px;

            }

            .new-chat {

                font-size: 12px;

            }

            .conversation {

                font-size: 12px;

            }

            .bubble {

                max-width: 88%;

                font-size: 13px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         BACKGROUND
    ===================================================== -->

    <div class="background-glow one"></div>

    <div class="background-glow two"></div>


    <div class="app">


        <!-- =================================================
             SIDEBAR
        ================================================= -->

        <aside class="sidebar">


            <div class="logo">

                <div class="logo-icon">
                    ✦
                </div>

                <span>
                    ShopAI
                </span>

            </div>


            <button
                class="new-chat"
                onclick="createNewConversation()"
            >

                + New Conversation

            </button>


            <div class="section-title">

                Conversations

            </div>


            <div
                id="conversationList"
                class="conversations"
            >

            </div>


        </aside>


        <!-- =================================================
             MAIN
        ================================================= -->

        <main class="main">


            <!-- HEADER -->

            <header class="header">

                <div class="header-content">

                    <span class="header-title">
                        E-commerce AI Assistant
                    </span>

                    <span class="online"></span>

                </div>

            </header>


            <!-- CHAT -->

            <div
                id="chat"
                class="chat"
            >

                <div
                    id="emptyState"
                    class="empty"
                >

                    <div class="empty-icon">
                        ✦
                    </div>

                    <h2>
                        How can I help you?
                    </h2>

                    <p>
                        Ask me about products, prices,
                        stock, delivery and store policies.
                    </p>

                </div>

            </div>


            <!-- TYPING -->

            <div
                id="typing"
                class="typing"
            >

                <div class="typing-bubble">

                    <span class="dot"></span>

                    <span class="dot"></span>

                    <span class="dot"></span>

                </div>

            </div>


            <!-- INPUT -->

            <div class="input-area">

                <div class="input-container">

                    <input
                        id="messageInput"
                        type="text"
                        placeholder="Ask about a product..."
                        autocomplete="off"
                    >

                    <button
                        id="sendButton"
                        onclick="sendMessage()"
                    >

                        ➤

                    </button>

                </div>

            </div>


        </main>


    </div>


    <script>


        /* =====================================================
           STATE
        ===================================================== */

        let currentSessionId = null;


        /* =====================================================
           DOM
        ===================================================== */

        const chat =
            document.getElementById(
                "chat"
            );


        const messageInput =
            document.getElementById(
                "messageInput"
            );


        const sendButton =
            document.getElementById(
                "sendButton"
            );


        const typing =
            document.getElementById(
                "typing"
            );


        const conversationList =
            document.getElementById(
                "conversationList"
            );


        const emptyState =
            document.getElementById(
                "emptyState"
            );


        /* =====================================================
           SESSION ID
        ===================================================== */

        function generateSessionId() {

            if (
                window.crypto &&
                crypto.randomUUID
            ) {

                return crypto.randomUUID();

            }

            return (
                Date.now()
                +
                "-"
                +
                Math.random()
                    .toString(36)
                    .substring(2)
            );

        }


        /* =====================================================
           CLEAR CHAT
        ===================================================== */

        function clearChat() {

            chat.innerHTML = "";

            emptyState.style.display =
                "flex";

            chat.appendChild(
                emptyState
            );

        }


        /* =====================================================
           SCROLL
        ===================================================== */

        function scrollToBottom() {

            requestAnimationFrame(() => {

                chat.scrollTop =
                    chat.scrollHeight;

            });

        }


        /* =====================================================
           ADD MESSAGE
        ===================================================== */

        function addMessage(
            role,
            content
        ) {

            emptyState.style.display =
                "none";


            const row =
                document.createElement(
                    "div"
                );


            const avatar =
                document.createElement(
                    "div"
                );


            const bubble =
                document.createElement(
                    "div"
                );


            /* Row */

            row.className =
                "message-row " +
                (
                    role === "user"
                        ? "user"
                        : "assistant"
                );


            /* Avatar */

            avatar.className =
                "avatar " +
                (
                    role === "user"
                        ? "user"
                        : "ai"
                );


            avatar.textContent =
                role === "user"
                    ? "U"
                    : "✦";


            /* Bubble */

            bubble.className =
                "bubble";


            bubble.textContent =
                content;


            /* Append */

            row.appendChild(
                avatar
            );

            row.appendChild(
                bubble
            );


            chat.appendChild(
                row
            );


            scrollToBottom();

        }


        /* =====================================================
           CREATE NEW CONVERSATION
        ===================================================== */

        async function createNewConversation() {

            const sessionId =
                generateSessionId();


            try {

                const response =
                    await fetch(
                        "/conversations",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                session_id:
                                    sessionId
                            })

                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Failed to create conversation"
                    );

                }


                currentSessionId =
                    sessionId;


                clearChat();


                await loadConversations();


                messageInput.focus();


            }

            catch (error) {

                console.error(
                    error
                );

                alert(
                    "Unable to create a new conversation."
                );

            }

        }


        /* =====================================================
           LOAD CONVERSATIONS
        ===================================================== */

        async function loadConversations() {

            try {

                const response =
                    await fetch(
                        "/conversations"
                    );


                if (!response.ok) {

                    throw new Error(
                        "Failed to load conversations"
                    );

                }


                const data =
                    await response.json();


                renderConversations(
                    data.conversations || []
                );


                /*
                    Open latest conversation
                    if nothing is selected.
                */

                if (
                    !currentSessionId &&
                    data.conversations &&
                    data.conversations.length
                ) {

                    await openConversation(
                        data.conversations[0]
                            .session_id
                    );

                }

            }

            catch (error) {

                console.error(
                    "loadConversations:",
                    error
                );

            }

        }


        /* =====================================================
           RENDER CONVERSATIONS
        ===================================================== */

        function renderConversations(
            conversations
        ) {

            conversationList.innerHTML =
                "";


            if (!conversations.length) {

                conversationList.innerHTML = `

                    <div
                        style="
                            color:#5e6173;
                            font-size:12px;
                            padding:10px;
                        "
                    >

                        No conversations yet.

                    </div>

                `;

                return;

            }


            conversations.forEach(
                conversation => {


                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "conversation " +
                        (
                            conversation.session_id
                            === currentSessionId
                                ? "active"
                                : ""
                        );


                    const title =
                        document.createElement(
                            "div"
                        );


                    title.className =
                        "conversation-title";


                    title.textContent =
                        conversation.title
                        ||
                        "New Conversation";


                    const deleteButton =
                        document.createElement(
                            "button"
                        );


                    deleteButton.className =
                        "delete-conversation";


                    deleteButton.textContent =
                        "×";


                    deleteButton.onclick =
                        async function(event) {

                            event.stopPropagation();

                            await deleteConversation(
                                conversation.session_id
                            );

                        };


                    item.appendChild(
                        title
                    );


                    item.appendChild(
                        deleteButton
                    );


                    item.onclick =
                        async function() {

                            await openConversation(
                                conversation.session_id
                            );

                        };


                    conversationList.appendChild(
                        item
                    );

                }
            );

        }


        /* =====================================================
           OPEN CONVERSATION
        ===================================================== */

        async function openConversation(
            sessionId
        ) {

            try {

                const response =
                    await fetch(
                        `/conversations/${encodeURIComponent(
                            sessionId
                        )}`
                    );


                if (!response.ok) {

                    throw new Error(
                        "Conversation not found"
                    );

                }


                const data =
                    await response.json();


                currentSessionId =
                    sessionId;


                clearChat();


                /*
                    Support both possible
                    backend response formats.
                */

                const messages =
                    data.messages
                    ||
                    data.conversation?.messages
                    ||
                    [];


                messages.forEach(
                    message => {

                        addMessage(
                            message.role,
                            message.content
                        );

                    }
                );


                await loadOnlyConversations();


                scrollToBottom();

            }

            catch (error) {

                console.error(
                    error
                );

            }

        }


        /* =====================================================
           REFRESH SIDEBAR ONLY
        ===================================================== */

        async function loadOnlyConversations() {

            try {

                const response =
                    await fetch(
                        "/conversations"
                    );


                const data =
                    await response.json();


                renderConversations(
                    data.conversations || []
                );

            }

            catch (error) {

                console.error(
                    error
                );

            }

        }


        /* =====================================================
           DELETE CONVERSATION
        ===================================================== */

        async function deleteConversation(
            sessionId
        ) {

            try {

                const response =
                    await fetch(
                        `/conversations/${encodeURIComponent(
                            sessionId
                        )}`,
                        {
                            method: "DELETE"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Failed to delete conversation"
                    );

                }


                if (
                    currentSessionId
                    === sessionId
                ) {

                    currentSessionId =
                        null;

                    clearChat();

                }


                await loadConversations();

            }

            catch (error) {

                console.error(
                    error
                );

                alert(
                    "Unable to delete conversation."
                );

            }

        }


        /* =====================================================
           SEND MESSAGE
        ===================================================== */

        async function sendMessage() {

            const message =
                messageInput.value.trim();


            if (!message) {

                return;

            }


            /*
                Create conversation automatically
            */

            if (!currentSessionId) {

                await createNewConversation();

                if (!currentSessionId) {

                    return;

                }

            }


            /*
                Show user message
            */

            addMessage(
                "user",
                message
            );


            messageInput.value =
                "";


            sendButton.disabled =
                true;


            messageInput.disabled =
                true;


            typing.style.display =
                "block";


            try {

                const response =
                    await fetch(
                        "/chat",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                session_id:
                                    currentSessionId,

                                message:
                                    message

                            })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.detail
                        ||
                        "Server error"
                    );

                }


                /*
                    Your current backend
                    returns the AI answer
                    as `response`.

                    Also support `message`
                    just in case.
                */

                const aiResponse =
                    data.response
                    ||
                    data.message
                    ||
                    "No response received.";


                addMessage(
                    "assistant",
                    aiResponse
                );


                await loadOnlyConversations();

            }

            catch (error) {

                console.error(
                    "Chat error:",
                    error
                );


                addMessage(
                    "assistant",
                    "Unable to connect to the AI server."
                );

            }

            finally {

                typing.style.display =
                    "none";


                sendButton.disabled =
                    false;


                messageInput.disabled =
                    false;


                messageInput.focus();

            }

        }


        /* =====================================================
           ENTER KEY
        ===================================================== */

        messageInput.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                    &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );


        /* =====================================================
           START APPLICATION
        ===================================================== */

        window.addEventListener(
            "load",
            async function() {

                await loadConversations();

                messageInput.focus();

            }
        );


    </script>

</body>

</html>
